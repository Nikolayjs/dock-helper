<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedAssist — нет связи с сервером</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #1a1b1e;
        background: #f8f9fa;
      }
      .box { max-width: 420px; text-align: center; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 16px; color: #5c5f66; line-height: 1.5; }
      button {
        font: inherit; padding: 10px 18px; border: 0; border-radius: 8px;
        background: #4C6FFF; color: #fff; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!--
      Страница на случай, когда сети нет.

      Она нарочно пустая по смыслу: показать «приложение» с записями пациентов офлайн значило бы
      показать вчерашние данные, выдав их за сегодняшние. Здесь честнее сказать, что связи нет.

      Нужна она и ради установки: часть браузеров на Chromium (в том числе Яндекс.Браузер) считает
      приложение устанавливаемым, только если оно отвечает чем-то осмысленным без сети. Без неё
      предлагается лишь «ярлык», открывающий сайт внутри браузера.
    -->
    <div class="box">
      <h1>MedAssist не может связаться с сервером</h1>
      <p>
        Похоже, пропала связь. MedAssist работает с данными на сервере, поэтому без него показать
        их нечем: устаревшая копия карточек была бы опаснее, чем её отсутствие.
      </p>
      <button onclick="location.reload()">Повторить</button>
    </div>
  </body>
</html>
