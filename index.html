<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Всё между метками — запасное: у публичных страниц пререндер (scripts/prerender.mjs) вырезает
      этот блок целиком и ставит свой. Метки нужны именно поэтому: без них запасной canonical и
      запасные OG оставались рядом со страничными, и на /pricing приезжали два разных canonical —
      а два канонических адреса это то же самое, что ни одного.

      Остаётся блок тому, что не пререндерится: экрану входа и приложению под /app.
    -->
    <!--
      Манифест и иконка приложения стоят ВЫШЕ меток пререндера, и это важно: всё между метками он
      вырезает целиком и ставит своё, страничное. Вписанные внутрь, они пропадали из собранного
      `index.html` — а его же статический сервер отдаёт на все адреса приложения, так что
      устанавливать было нечего. Здесь они не страничные: манифест один на весь сайт.
    -->
    <!--
      Манифест отдаёт сервер, а не статика: `theme_color` в нём — последний цвет шапки на этом
      устройстве (кука `medassist-theme-color`, см. `themeColorMeta.ts`). Установленное на Android
      приложение красит строку состояния цветом из **манифеста**, а не из меты страницы — проверено
      на телефоне: во вкладке Chrome панель тёмная, в приложении бар белый, как `theme_color`.
      Без `use-credentials` браузер запрашивает манифест без кук, и сервер не узнал бы цвет.
      Заготовка лежит рядом (`manifest.template.json`); в dev её под этим адресом отдаёт Vite.
    -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <!--
      Цвет полосы заголовка окна PWA и строки состояния Android.

      Две меты, а не одна: у приложения светлая и тёмная темы, и одно значение обязательно врёт про
      одну из них. Значения — измеренный цвет самой шапки: белый в светлой, `#242424` в тёмной.
      Дальше, когда оболочка отрисована, `themeColorMeta` вставляет перед ними свою мету с точным
      цветом шапки — включая подкраску под обои, которой здесь знать неоткуда.

      Скрипт ниже ставит эту мету **сразу**, из цвета, запомненного при прошлом запуске
      (`THEME_COLOR_STORAGE_KEY` в `themeColorMeta.ts`). Установленное на телефон приложение читает
      `theme-color` при запуске, и мета, вставленная после отрисовки, до полосы состояния могла не
      доехать: телефон в светлой системной теме, приложение в тёмной — и полоса оставалась светлой.
      Только под `/app`: на публичном сайте шапки приложения нет, и её цвет там ни при чём.
      Инлайн-скрипт в `<head>` здесь не первый — так же устроена защита пререндера
      (`scripts/prerender.mjs`).
    -->
    <script>
      (function () {
        try {
          if (!/^\/app(\/|$)/.test(location.pathname)) return;
          var color = localStorage.getItem('medassist:theme-color');
          if (!color || !/^#[0-9a-f]{6}$/i.test(color)) return;
          var meta = document.createElement('meta');
          meta.name = 'theme-color';
          meta.content = color;
          meta.setAttribute('data-app-theme-color', '');
          document.head.prepend(meta);
        } catch (e) {
          /* нет хранилища — работают меты ниже */
        }
      })();
    </script>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#242424" media="(prefers-color-scheme: dark)" />
    <!-- iOS накладывает маску сам и прозрачность заливает чёрным, поэтому значок для него
         непрозрачный и во всю площадь — отдельный от значка приложения. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- prerender:meta:start -->
    <title>MedAssist — ассистент врача</title>
    <meta
      name="description"
      content="Рабочее место врача в браузере: пациенты и визиты, диспансерный учёт, печатные бланки с подписью, справочник препаратов, анализы с референсами и калькуляторы."
    />
    <link rel="canonical" href="https://medhelpmate.ru/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MedAssist" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://medhelpmate.ru/" />
    <meta property="og:title" content="MedAssist — ассистент врача" />
    <meta
      property="og:description"
      content="Пациенты, диспансерный учёт и печатные формы в одном месте — без МИС и без бумаги."
    />
    <meta property="og:image" content="https://medhelpmate.ru/landing/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MedAssist — ассистент врача" />
    <meta
      name="twitter:description"
      content="Пациенты, диспансерный учёт и печатные формы в одном месте — без МИС и без бумаги."
    />
    <meta name="twitter:image" content="https://medhelpmate.ru/landing/og.png" />
    <!-- prerender:meta:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
